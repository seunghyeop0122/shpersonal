<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SH site</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <!-- 사이트 본문. 로그인하지 않은 상태로 들어오면 app.js가 로그인 페이지(./)로 되돌립니다. -->
  <div class="layout" id="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="site-mark"></span>
        <span class="site-title">SH site</span>
      </div>
      <nav class="sidebar-nav" id="nav"></nav>
      <div class="authbar" id="authbar"></div>
    </aside>

    <main class="main">
      <div class="page" id="view"></div>
    </main>
  </div>

  <!-- Supabase 연결 설정 (URL / anon key) -->
  <script src="./assets/js/supabase-config.js"></script>

  <!-- 예시 데이터: Supabase 설정 전(로컬 개발)에만 읽기 전용으로 표시됩니다 -->
  <script src="./data/companies.js"></script>
  <script src="./data/industries.js"></script>
  <script src="./data/jobs.js"></script>
  <script src="./data/goals.js"></script>

  <!-- 앱 (ES 모듈 → 로컬에서 열 때는 file:// 이 아니라 로컬 서버가 필요합니다) -->
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
