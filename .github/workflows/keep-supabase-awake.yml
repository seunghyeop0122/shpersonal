# Supabase 무료 플랜은 7일간 사용이 없으면 프로젝트를 일시정지합니다.
# 일시정지되면 주소 자체가 사라져 사이트 로그인·데이터가 모두 멈추므로,
# 3일마다 DB에 가벼운 조회를 한 번 보내 "사용 중" 상태를 유지합니다.
# (anon 키는 공개용이라 supabase-config.js 에서 그대로 읽어 씁니다)
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 0 */3 * *'   # 3일마다 09:00 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" assets/js/supabase-config.js)
          KEY=$(grep -oE "eyJ[A-Za-z0-9._-]+" assets/js/supabase-config.js)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" "$URL/rest/v1/goals?select=id&limit=1")
          echo "HTTP $CODE"
          test "$CODE" = "200"
